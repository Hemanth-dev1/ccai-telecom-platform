steps:
  # ============================================
  # BACKEND: Build & Push
  # ============================================
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/aurora-backend:${_TAG:-latest}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/aurora-backend:${SHORT_SHA}"
      - ./backend
    id: build-backend

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/aurora-backend"
    id: push-backend

  # ============================================
  # FRONTEND: Build & Push
  # ============================================
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/aurora-frontend:${_TAG:-latest}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/aurora-frontend:${SHORT_SHA}"
      - ./frontend
    id: build-frontend

  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/aurora-frontend"
    id: push-frontend

  # ============================================
  # BACKEND: Deploy to Cloud Run
  # ============================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - aurora-backend
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/aurora-backend:${_TAG:-latest}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --concurrency=50
      - --timeout=120s
      - --set-env-vars=^~^GEMINI_API_KEY=${_GEMINI_API_KEY}~PROJECT_ID=${_DF_PROJECT_ID}~LOCATION_ID=${_LOCATION_ID}~AGENT_ID=${_AGENT_ID}
      # Mount GCS bucket for SQLite persistence (requires bucket to exist)
      # Uncomment and configure the bucket name:
      # - --add-volume=name=aurora-data,type=cloud-storage,bucket=${_DATA_BUCKET}
      # - --add-volume-mount=volume=aurora-data,mount-path=/app/data
    id: deploy-backend

  # ============================================
  # FRONTEND: Deploy to Cloud Run
  # ============================================
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - aurora-frontend
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/aurora-frontend:${_TAG:-latest}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --concurrency=80
      - --timeout=60s
      - --set-env-vars=VITE_API_BASE=https://${_BACKEND_URL}
    id: deploy-frontend

substitutions:
  _REGION: us-central1
  _REPOSITORY: aurora-repo
  _TAG: latest
  _GEMINI_API_KEY: "set-me-in-trigger"
  _DF_PROJECT_ID: "set-me-in-trigger"
  _LOCATION_ID: global
  _AGENT_ID: "set-me-in-trigger"
  _DATA_BUCKET: "aurora-sqlite-data"
  _BACKEND_URL: "https://aurora-backend-xxx-uc.a.run.app"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1800s  # 30 minutes
