version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aurora-backend
    ports:
      - "8008:8080"
    env_file:
      - ./backend/.env
    volumes:
      # Persist SQLite database and ChromaDB between restarts
      - aurora-data:/app/data
    environment:
      - PORT=8080
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - AUTH_USERNAME=Hemanth
        - AUTH_PASSWORD=Hemanth@123
    environment:
      - BACKEND_URL=http://backend:8080
    container_name: aurora-frontend
    ports:
      - "80:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  aurora-data:
